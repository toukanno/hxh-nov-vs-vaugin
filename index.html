<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0"
    />
    <meta name="theme-color" content="#0c111b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nov vs Uvogin" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>HxH Nov vs Uvogin バトルロワイヤル</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="layout">
      <header>
        <h1>HxH Nov vs Uvogin</h1>
        <p class="subtitle">ノヴとして生き残れ。最後の1人になれば勝利！</p>
      </header>

      <section class="hud" aria-label="ゲーム情報">
        <div class="stat"><span>体力</span><strong id="hpValue">100</strong></div>
        <div class="stat"><span>敵残数</span><strong id="enemiesValue">0</strong></div>
        <div class="stat"><span>経過時間</span><strong id="timeValue">0.0s</strong></div>
        <div class="stat"><span>状態</span><strong id="stateValue">待機中</strong></div>
      </section>

      <section class="controls desktop-only" aria-label="キーボード操作">
        <p>
          <kbd>W A S D</kbd> / <kbd>矢印</kbd>: 移動　<kbd>Space</kbd>: 攻撃　<kbd>Shift</kbd>: 回避
        </p>
      </section>

      <section class="arena-wrap">
        <canvas id="gameCanvas" width="960" height="540" aria-label="バトルアリーナ"></canvas>

        <div class="touch-controls" aria-hidden="true">
          <div class="stick-zone" id="stickZone">
            <div class="stick-base"></div>
            <div class="stick-knob" id="stickKnob"></div>
          </div>
          <div class="action-zone">
            <button class="action-btn attack" id="btnAttack" type="button" aria-label="攻撃">
              攻撃
            </button>
            <button class="action-btn dash" id="btnDash" type="button" aria-label="回避">
              回避
            </button>
          </div>
        </div>

        <div class="overlay" id="overlay">
          <p id="overlayMessage">「開始」を押してゲームをスタート</p>
          <button id="startButton" type="button">開始 / リトライ</button>
        </div>
      </section>
    </main>

    <script type="module" src="game.js"></script>
  </body>
</html>
